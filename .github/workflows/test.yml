name: Test HTML/CSS

on:
  push:
    branches: [ "TTS" ]
  pull_request:
    branches: [ "TTS" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check HTML files
      run: |
        echo "🔍 Checking HTML files..."
        find . -name "*.html" -exec echo "Found: {}" \;
    
    - name: Check CSS files
      run: |
        echo "🔍 Checking CSS files..."
        find . -name "*.css" -exec echo "Found: {}" \;
    
    - name: Validate HTML syntax
      run: |
        sudo apt-get install -y tidy
        find . -name "*.html" -exec tidy -errors {} \; || echo "✅ No critical HTML errors"
    
    - name: List all files
      run: |
        echo "📁 Project files:"
        ls -la