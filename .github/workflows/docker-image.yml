name: Build and Push Docker Image

on:
  push:
    branches: [ "TTS" ]
  pull_request:
    branches: [ "TTS" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code so the runner can access it
    - name: Check out the repo
      uses: actions/checkout@v4

    # Step 2: Log in to Docker Hub using the repository secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }} # Replace with your secret name if different (e.g., DOCKER_TOKEN)

    # Step 3: Extract metadata (tags, labels) for Docker
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/for-testing-git-commands

    # Step 4: Build and push the Docker image
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
